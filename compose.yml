---
services:
  db:
    image: mariadb:12.3@sha256:ab1c3dd381940233af12512b97d47b508fd3a0f17fbe3ba388739b7bc17cbc0b
    volumes:
    - db_data:/var/lib/mysql
    env_file:
    - .env
    
  web:
    depends_on:
    - db
    build:
      context: .
      target: development
    env_file:
    - .env
    volumes:
    - ./docker/web/auth_openidc.conf:/etc/apache2/mods-enabled/auth_openidc.conf
    - ./docker/web/000-default.conf:/etc/apache2/sites-available/000-default.conf
    - .:/var/www/html
    ports:
    - "80:80"

volumes:
  db_data: {}
